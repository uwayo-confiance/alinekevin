<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Names Card</title>

  <style>
    body{
      margin:0;
      padding:0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .container{
      background:white;
      padding:30px;
      border-radius:20px;
      width:350px;
      box-shadow:0 5px 20px rgba(0,0,0,0.2);
      text-align:center;
    }

    h1{
      color:#333;
      margin-bottom:20px;
    }

    ul{
      list-style:none;
      padding:0;
    }

    li{
      background:#f4f4f4;
      margin:10px 0;
      padding:12px;
      border-radius:10px;
      font-size:18px;
      transition:0.3s;
    }

    li:hover{
      background:#4facfe;
      color:white;
      transform:scale(1.05);
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Students Names</h1>

    <ul>
      <li>Confiance</li>
        <li>eunice</li>
      <li>Kevin</li>
      <li>Liliane</li>
      <li>Silvie</li>
      <li>Viviane</li>
      <li>Aline</li>
      <li>Clarisse</li>
      <li>Delphine</li>
    </ul>
  </div>

</body>
</html>
